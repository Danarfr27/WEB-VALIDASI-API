<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FE4RD0WN API Key Checker — Gemini / OpenAI</title>
  <!-- Improved typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <meta name="description" content="Cek status API key massal untuk Gemini (Google Generative) atau OpenAI. Download hasil aktif/invalid sebagai .txt">
    <style>
      /* Contrast overrides */
      .btn.primary { background: #ff2d2d !important; color: #fff !important; border-radius: 10px; padding: 10px 14px; border: none; }
      .lead, .marquee span { color: #ffffff !important; }
      /* Back button (top-left) */
      .back-btn { position: fixed; left: 18px; top: 14px; z-index: 1100; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 8px 10px; border-radius: 10px; display:flex;align-items:center;gap:8px; cursor:pointer; }
      .back-btn svg { display:block; }
    </style>
</head>
<body>
    <button class="back-btn" title="Kembali" onclick="window.open('https://wormuptodate.vercel.app/','_blank')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5" />
        <path d="M12 19l-7-7 7-7" />
      </svg>
      Kembali
    </button>
  <header class="topbar">
    <div class="container">
      <h1 class="sr-only">Bulk API Key Checker</h1>
      <div class="marquee-wrap" aria-hidden="false">
        <div class="marquee">
          <span>[MASS APIKEYS CHECKER] — Gemini &amp; OPENAI</span>
          <span>API Key Checker — Gemini / OpenAI</span>
        </div>
      </div>
      <p class="lead"></p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <label class="field">Provider
        <select id="provider">
          <option value="gemini">Gemini / Google Generative</option>
          <option value="openai">OpenAI</option>
        </select>
      </label>

      <div class="columns">
        <div class="col">
          <label class="field">Upload file `.txt` (satu key per baris)
            <input id="fileInput" type="file" accept=".txt" />
          </label>

          <label class="field">Atau paste di sini (satu per baris)
            <textarea id="pasteArea" placeholder="Masukkan API keys di sini..."></textarea>
          </label>

          <label class="field small">Batch size (permintaan bersamaan)
            <input id="batchSize" type="number" min="1" max="50" value="8">
          </label>

          <div class="actions">
            <button id="startBtn" class="btn primary">Mulai Cek</button>
            <button id="clearBtn" class="btn primary">Bersihkan</button>
          </div>
        </div>

        <div class="col">
          <div class="status">
            <div id="progress">Menunggu tindakan...</div>
            <div id="counts">Aktif: 0 — Invalid: 0 — Total: 0</div>
          </div>

          <div class="results">
            <table id="resultsTable">
              <thead><tr><th>#</th><th>Key (masked)</th><th>Status</th><th>Kode</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="downloads">
            <button id="downloadActive" class="btn primary" disabled>Download aktif (.txt)</button>
            <button id="downloadInvalid" class="btn primary" disabled>Download invalid (.txt)</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="container">Copyright Personal All Rights Reserved
Designed by Dancode</div>
  </footer>

  <script src="/assets/js/theme-toggle.js"></script>
  <script src="/assets/js/visuals.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
